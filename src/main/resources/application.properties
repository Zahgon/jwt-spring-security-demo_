# ---------------------------------------------------------------------------
# HTTP layer (translated from the Spring `server.*` block).
# `server.servlet.context-path: /` becomes the Quarkus default root path, so no
# `quarkus.http.root-path` is declared here: every resource keeps its own path.
# ---------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.test-port=0

# CORS is handled by org.zerhusen.config.CorsConfig, which mirrors the Spring
# CorsFilter registration scoped to /api/** rather than the whole server.

# ---------------------------------------------------------------------------
# Persistence (translated from `spring.jpa.*` / the H2 datasource block).
# NON_KEYWORDS=USER keeps the legacy `USER` table name usable on H2 2.x.
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
quarkus.datasource.jdbc.initial-size=2
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=30S

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# ---------------------------------------------------------------------------
# JSON rendering - `spring.jackson.serialization.INDENT_OUTPUT: true`.
# ---------------------------------------------------------------------------
quarkus.jackson.write-dates-as-timestamps=false

# ---------------------------------------------------------------------------
# JWT settings - a verbatim carry-over of the `jwt.*` block in application.yml.
# ---------------------------------------------------------------------------
jwt.header=Authorization
jwt.base64-secret=ZmQ0ZGI5NjQ0MDQwY2I4MjMxY2Y3ZmI3MjdhN2ZmMjNhODViOTg1ZGE0NTBjMGM4NDA5NzYxMjdjOWMwYWRmZTBlZjlhNGY3ZTg4Y2U3YTE1ODVkZDU5Y2Y3OGYwZWE1NzUzNWQ2YjFjZDc0NGMxZWU2MmQ3MjY1NzJmNTE0MzI=
jwt.token-validity-in-seconds=86400
jwt.token-validity-in-seconds-for-remember-me=108000
jwt.route.authentication.path=auth
jwt.route.authentication.refresh=refresh

# ---------------------------------------------------------------------------
# Logging - `logging.level.org.zerhusen.security: DEBUG`.
# ---------------------------------------------------------------------------
quarkus.log.category."org.zerhusen.security".level=DEBUG
quarkus.log.category."org.zerhusen.security".min-level=DEBUG
quarkus.banner.path=banner.txt
